<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAS TRUMP INVADED MEXICO YET | Status</title>

<style>
/* =====================================================
   1) FORCE COMIC SANS (NO CURSIVE, NO SCRIPT)
===================================================== */
@font-face{
  font-family:"ComicSansWeb";
  src:
    url("https://cdn.jsdelivr.net/gh/identicons/comic-sans-ms/ComicSansMS.woff2") format("woff2"),
    url("https://cdn.jsdelivr.net/gh/identicons/comic-sans-ms/ComicSansMS.woff") format("woff");
  font-display: swap;
}

html, body, *{
  font-family:"ComicSansWeb","Comic Sans MS","Comic Sans",sans-serif !important;
  font-style: normal !important;
  font-weight: 700 !important;
  box-sizing: border-box;
}

html, body{
  height:100%;
  margin:0;
  color:white;
  cursor:crosshair;
}

/* =====================================================
   2) USA FLAG BACKGROUND (CSS)
===================================================== */
body{
  background:
    linear-gradient(#0033a0,#0033a0) left top / 42% 54% no-repeat,
    repeating-linear-gradient(
      to bottom,
      #b31942 0 7.69%,
      #ffffff 7.69% 15.38%
    );
  background-attachment: fixed;
  overflow-x: hidden;
}

/* Stars in canton */
body::before{
  content:"";
  position:fixed;
  top:0; left:0;
  width:42%;
  height:54%;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle, rgba(255,255,255,.95) 0 1.3px, transparent 1.4px)
    0 0 / 30px 22px repeat;
}

/* =====================================================
   3) BACKGROUND GIFS (ONLINE: FIRE + USA + TRUMP)
===================================================== */
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;

  background-image:
    /* FIRE */
    url("https://media.giphy.com/media/3o6ZsYm5t9D8F7X2Xm/giphy.gif"),
    url("https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif"),

    /* USA / EAGLE */
    url("https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"),
    url("https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif"),

    /* TRUMP */
    url("https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif"),
    url("https://media.giphy.com/media/3o6Zt6ML6BklcajjsA/giphy.gif");

  background-repeat: repeat;
  background-size:
    180px auto,
    260px auto,
    160px auto,
    200px auto,
    220px auto,
    260px auto;

  background-position:
    0 0,
    100px 160px,
    40px 60px,
    160px 30px,
    80px 240px,
    260px 120px;

  opacity:.38;
  mix-blend-mode: screen;
  filter: saturate(1.2) contrast(1.05);
}

/* =====================================================
   4) 90s CHROME
===================================================== */
.wrap{
  position:relative;
  z-index:2;
  max-width:1000px;
  margin:auto;
  padding:14px;
}

.frame{
  border:10px ridge #777;
  background:rgba(0,0,0,.82);
  padding:12px;
}

.topbar{
  border:7px groove #444;
  background:rgba(0,0,0,.75);
  padding:10px;
  margin-bottom:10px;
}

marquee{
  color:#ffff66;
  font-size:18px;
  text-shadow:0 0 10px yellow;
}

.hero{
  border:7px inset #666;
  padding:14px;
  background:rgba(0,0,0,.75);
}

.title{
  text-align:center;
  font-size:56px;
  letter-spacing:2px;
  text-shadow:0 0 12px cyan,0 0 24px magenta,0 0 36px lime;
}

.subtitle{
  text-align:center;
  font-size:14px;
  color:#ddd;
}

.statusBox{
  margin-top:12px;
  padding:20px;
  border:10px outset #888;
  background:#000;
  text-align:center;
}

.statusLabel{
  font-size:20px;
  margin-bottom:8px;
}

.statusNo{
  display:inline-block;
  font-size:96px;
  padding:12px 32px;
  border:10px double red;
  color:red;
  background:#200;
  text-shadow:0 0 15px red,0 0 30px orange;
  animation:pulse 1s infinite steps(1);
}

@keyframes pulse{
  0%,49%{filter:brightness(1);}
  50%,100%{filter:brightness(2);}
}

/* Counter */
.counter{
  margin-top:14px;
  border:6px inset #666;
  padding:10px;
  text-align:center;
}

.counterDigits{
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:8px;
}

.digit{
  width:22px;
  height:30px;
  border:3px outset #777;
  background:#0b0b0b;
  color:#66ff66;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.footer{
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#ddd;
}

.blink{
  animation:blink .8s infinite steps(1);
}
@keyframes blink{
  0%,49%{opacity:1;}
  50%,100%{opacity:.35;}
}
</style>
</head>

<body>
<div class="wrap">
<div class="frame">

<div class="topbar">
<marquee behavior="alternate">🇺🇸 HONOR • LOYALTY • USA 🇺🇸</marquee>
<marquee scrollamount="6">🔥 PATRIOT BACKGROUND MODE 🔥 FLAGS • FIRE • TRUMP • STATUS BOARD</marquee>
</div>

<div class="hero">
<div class="title">Has Trump Invaded Mexico Yet?</div>
<div class="subtitle">Personal status page aesthetic. Not an official source.</div>

<div class="statusBox">
<div class="statusLabel">Current status:</div>
<div class="statusNo">NO</div>
</div>

<div class="counter">
<div>👁️ Visitor Counter 👁️</div>
<div class="counterDigits" id="counterDigits"></div>
<div class="subtitle">Local 90s-style counter</div>
</div>
</div>

<div class="footer">
🚧 UNDER CONSTRUCTION 🚧 • <span class="blink">COMIC SANS LOCKED</span> • 90s FOREVER
</div>

</div>
</div>

<script>
(function(){
  const KEY="usa_watch_counter_v4";
  let n=Number(localStorage.getItem(KEY)||0)+1;
  localStorage.setItem(KEY,n);
  const s=String(n).padStart(8,"0");
  const c=document.getElementById("counterDigits");
  c.innerHTML="";
  for(const d of s){
    const e=document.createElement("div");
    e.className="digit";
    e.textContent=d;
    c.appendChild(e);
  }
})();
</script>
</body>
</html>
