<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAS TRUMP INVADED MEXICO YET? | Status</title>

<style>
@font-face{
  font-family:"ComicSansWeb";
  src:
    url("https://cdn.jsdelivr.net/gh/identicons/comic-sans-ms/ComicSansMS.woff2") format("woff2"),
    url("https://cdn.jsdelivr.net/gh/identicons/comic-sans-ms/ComicSansMS.woff")  format("woff");
  font-display: swap;
}
html, body, *{
  font-family:"ComicSansWeb","Comic Sans MS","Comic Sans",sans-serif !important;
  font-style: normal !important;
  font-weight: 700 !important;
  box-sizing: border-box;
}
html, body{height:100%;margin:0;color:#fff;cursor:crosshair;}

body{
  background:
    linear-gradient(#0033a0,#0033a0) left top / 42% 54% no-repeat,
    repeating-linear-gradient(
      to bottom,
      #b31942 0 7.69%,
      #ffffff 7.69% 15.38%
    );
  background-attachment: fixed;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  top:0; left:0;
  width:42%;
  height:54%;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle, rgba(255,255,255,.95) 0 1.3px, transparent 1.4px)
    0 0 / 30px 22px repeat;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background-image:
    url("https://i.pinimg.com/originals/b7/21/34/b72134112b54864e4948865375ecbb11.gif"),
    url("https://i.pinimg.com/originals/6d/a4/8b/6da48b2514bf7f13ab6f8c7d5f1037c1.gif"),
    url("https://blueprintexecutives.com/wp-content/uploads/2017/07/eagle-clipart-animated-gif-10.gif"),
    url("https://i.pinimg.com/originals/42/71/ab/4271abedba2e2d0d24cfea57099e5b1e.gif"),
    url("https://media2.giphy.com/media/26FAMbSfNaxcAdj9DQ/giphy.gif"),
    url("https://img1.picmix.com/output/stamp/normal/1/8/3/8/1648381_f93bc.gif");
  background-repeat: repeat;
  background-size: 180px auto,260px auto,160px auto,200px auto,220px auto,260px auto;
  background-position: 0 0,100px 160px,40px 60px,160px 30px,80px 240px,260px 120px;
  opacity:.38;
  mix-blend-mode: screen;
}

.wrap{position:relative;z-index:2;max-width:1000px;margin:auto;padding:14px;}
.frame{border:10px ridge #777;background:rgba(0,0,0,.82);padding:12px;}
.topbar{border:7px groove #444;background:rgba(0,0,0,.75);padding:10px;margin-bottom:10px;}
marquee{color:#ffff66;font-size:18px;text-shadow:0 0 10px yellow;}

.hero{border:7px inset #666;padding:14px;background:rgba(0,0,0,.75);}
.title{text-align:center;font-size:56px;letter-spacing:2px;text-shadow:0 0 12px cyan,0 0 24px magenta,0 0 36px lime;}
.subtitle{text-align:center;font-size:14px;color:#ddd;}

.statusBox{margin-top:12px;padding:20px;border:10px outset #888;background:#000;text-align:center;}
.statusLabel{font-size:20px;margin-bottom:8px;}
.statusText{
  display:inline-block;
  font-size:96px;
  padding:12px 32px;
  border:10px double red;
  color:red;
  background:#200;
  text-shadow:0 0 15px red,0 0 30px orange;
  animation:pulse 1s infinite steps(1);
}
@keyframes pulse{0%,49%{filter:brightness(1);}50%,100%{filter:brightness(2);}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
@media (max-width:820px){.grid{grid-template-columns:1fr;}}
.panel{border:6px inset #666;padding:10px;background:rgba(0,0,0,.75);}

.counterDigits{display:flex;justify-content:center;gap:4px;margin-top:8px;flex-wrap:wrap;}
.digit{width:22px;height:30px;border:3px outset #777;background:#0b0b0b;color:#66ff66;display:flex;align-items:center;justify-content:center;font-size:18px;}

.footer{margin-top:12px;text-align:center;font-size:13px;color:#ddd;}
.blink{animation:blink .8s infinite steps(1);}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:.35;}}

.small{font-size:12px;color:#cfcfcf;line-height:1.4;}
</style>
</head>

<body>
<div class="wrap">
  <div class="frame">

    <div class="topbar">
      <marquee behavior="alternate">🇺🇸 HONOR • LOYALTY • USA 🇺🇸</marquee>
      <marquee scrollamount="6">🔥 MAKE AMERICA GREAT AGAIN 🔥 • STATUS BOARD • AUTO CHECK • <span class="blink">LIVE</span></marquee>
    </div>

    <div class="hero">
      <div class="title">Has Trump Invaded Mexico Yet?</div>
      <div class="subtitle">Not an official source.</div>

      <div class="statusBox">
        <div class="statusLabel">Current status:</div>
        <div class="statusText" id="statusText">NO</div>
        <div class="small" style="margin-top:10px;">
          Last check: <span id="updatedAt">loading…</span><br>
          Matched headline: <span id="matchedHeadline">none</span>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div style="text-align:center;font-size:18px;">👁️ Visitor Counter 👁️</div>
          <div class="counterDigits" id="counterDigits"></div>
        </div>
        <div class="panel"></div>
      </div>

      <div class="footer">
        🚧 UNDER CONSTRUCTION 🚧 • <span class="blink">AMERICA FOREVER</span>
      </div>

    </div>
  </div>
</div>

<script>
/* Visitor counter */
(function(){
  const KEY="usa_watch_counter_v6";
  let n=Number(localStorage.getItem(KEY)||0)+1;
  localStorage.setItem(KEY,n);
  const s=String(n).padStart(8,"0");
  const c=document.getElementById("counterDigits");
  c.innerHTML="";
  for(const ch of s){
    const d=document.createElement("div");
    d.className="digit";
    d.textContent=ch;
    c.appendChild(d);
  }
})();

/* AUTO STATUS FROM CLOUDFLARE WORKER */
(async function(){
  try{
    const r = await fetch(
      "https://usa-watch-status.davidemmanuelvargasi.workers.dev/status",
      { cache: "no-store" }
    );
    const data = await r.json();

    const status = (data.status || "NO").toUpperCase();
    const el = document.getElementById("statusText");
    el.textContent = status;

    if(status === "YES"){
      el.style.color = "lime";
      el.style.borderColor = "lime";
      el.style.background = "#020";
    }

    document.getElementById("updatedAt").textContent = data.updated || "unknown";
    document.getElementById("matchedHeadline").textContent = data.matched_headline || "none";
  } catch(e){
    document.getElementById("updatedAt").textContent = "worker offline";
  }
})();
</script>
</body>
</html>
